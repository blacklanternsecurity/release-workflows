name: Python tests
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      uv-sync-args:
        type: string
        default: --all-extras
      pytest-args:
        type: string
        default: ""
      setup-script:
        description: Repository script run in every test leg before sync, for system packages or compose services. It may append to $GITHUB_ENV.
        type: string
        default: ""
      teardown-script:
        type: string
        default: ""
      env:
        description: JSON object of plain environment variables for the test job
        type: string
        default: "{}"
      secret-env:
        description: JSON list of secret names, each declared below and passed by name, exported under the same name
        type: string
        default: "[]"
      coverage:
        description: Upload cov.xml to Codecov with the CODECOV_TOKEN secret
        type: boolean
        default: false
      artifacts:
        description: Path uploaded from every test leg, pass or fail
        type: string
        default: ""
      lint:
        type: boolean
        default: true
      github-token:
        description: Give the pytest step the job's read-only GITHUB_TOKEN (contents read), for tests that call the GitHub API and hit the unauthenticated rate limit
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
      BBOT_IO_API_KEY:
        required: false
    outputs:
      python-versions:
        value: ${{ jobs.matrix.outputs.versions }}

permissions:
  contents: read

jobs:
  matrix:
    uses: $/.github/workflows/python-versions.yml
    with:
      working-directory: ${{ inputs.working-directory }}

  lint:
    if: inputs.lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - env:
          SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          read -ra args <<<"$SYNC_ARGS"
          uv sync --no-install-project "${args[@]}"
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check

  test:
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    env: ${{ fromJSON(inputs.env) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - if: inputs.setup-script != ''
        env:
          SCRIPT: ${{ inputs.setup-script }}
        run: '"./$SCRIPT"'
      - env:
          SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          read -ra args <<<"$SYNC_ARGS"
          uv sync "${args[@]}"
      - if: needs.matrix.outputs.maturin == 'true'
        run: uv run --no-sync maturin develop --release
      # Only pytest sees the secrets secret-env names and, with github-token, the job token: not
      # setup, sync, coverage or teardown. The launcher hands them to the pytest process alone;
      # SECRETS and NAMES never reach it.
      - env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          # Only the secrets declared above reach a reusable workflow; secret-env picks from those by name.
          SECRETS: ${{ inputs.secret-env != '[]' && toJSON(secrets) || '{}' }} # zizmor: ignore[overprovisioned-secrets]
          NAMES: ${{ inputs.secret-env }}
          JOB_TOKEN: ${{ inputs.github-token && github.token || '' }}
        run: |
          read -ra args <<<"$PYTEST_ARGS"
          exec python3 - uv run --no-sync pytest "${args[@]}" <<'PY'
          import json, os, sys
          env = dict(os.environ)
          values, names, token = json.loads(env.pop("SECRETS")), json.loads(env.pop("NAMES")), env.pop("JOB_TOKEN")
          for n in names:
              if values.get(n):
                  env[n] = values[n]
              else:
                  print(f"::warning::secret {n} is unavailable, as on fork pull requests", flush=True)
          if token:
              env["GITHUB_TOKEN"] = token
          os.execvpe(sys.argv[1], sys.argv[1:], env)
          PY
      - if: inputs.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.working-directory }}/cov.xml
          fail_ci_if_error: false
      - if: always() && inputs.artifacts != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-${{ matrix.python-version }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifacts }}
          if-no-files-found: ignore
      - if: always() && inputs.teardown-script != ''
        env:
          SCRIPT: ${{ inputs.teardown-script }}
        run: '"./$SCRIPT"'

  passed:
    if: always()
    needs: [matrix, lint, test]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          ! grep -qE 'failure|cancelled' <<<"$RESULTS"
