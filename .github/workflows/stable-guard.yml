name: Stable guard
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      allow-commit-pinned-git:
        description: >-
          Accept a uv git source pinned to a full 40-character commit (rev), for a private dependency
          with no registry release. Branches, tags, short revs and URL sources are still refused.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-ready:
    name: release ready
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - env:
          ROOT: ${{ inputs.working-directory }}
          ALLOW_COMMIT_PINNED_GIT: ${{ inputs.allow-commit-pinned-git }}
        run: |
          flags=()
          [ "$ALLOW_COMMIT_PINNED_GIT" = true ] && flags+=(--allow-commit-pinned-git)
          uv run --no-project --with packaging --with pyyaml python .shared/scripts/manifest.py --root "$ROOT" release "${flags[@]}"
